<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PCT toggle bear-hang geometry</title>
  <desc id="desc">A schematic showing a food bag suspended from a carabiner beneath a live branch. The cord passes over the branch and back through the carabiner, where a stick toggle holds it without a rope tied to the trunk. Measurement arrows show a conservative target of at least 12 feet from the loaded bag to the ground and 6 feet from the bag to the trunk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a14"/>
      <stop offset="1" stop-color="#17261c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f1d88e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1180" height="700" rx="28" fill="url(#bg)" stroke="#496251" stroke-width="2"/>

  <text x="58" y="68" fill="#f2f7f3" font-family="system-ui, sans-serif" font-size="30" font-weight="700">PCT toggle hang: final geometry</text>
  <text x="58" y="104" fill="#b9cbbd" font-family="system-ui, sans-serif" font-size="18">A practiced fallback—not a substitute for a suitable tree, current order, or certified canister.</text>

  <path d="M1000 132 C1035 245 1017 405 1052 650 L1152 650 C1110 430 1134 257 1092 132 Z" fill="#62452f" stroke="#8e6b4d" stroke-width="4"/>
  <path d="M1057 168 C937 143 802 151 646 174 C540 190 455 190 360 170" fill="none" stroke="#76543a" stroke-width="45" stroke-linecap="round"/>
  <path d="M1057 158 C938 137 800 146 644 169 C537 184 453 185 359 165" fill="none" stroke="#9a7552" stroke-width="8" stroke-linecap="round" opacity=".75"/>
  <text x="1026" y="625" fill="#d8e4da" font-family="system-ui, sans-serif" font-size="18">supporting trunk</text>
  <text x="650" y="137" fill="#d8e4da" font-family="system-ui, sans-serif" font-size="18">strong live branch</text>

  <path d="M485 184 C480 210 482 254 482 309" fill="none" stroke="#e9f1ea" stroke-width="7" stroke-linecap="round"/>
  <path d="M511 184 C518 222 519 260 516 309" fill="none" stroke="#e9f1ea" stroke-width="7" stroke-linecap="round"/>
  <path d="M482 184 Q496 146 511 184" fill="none" stroke="#e9f1ea" stroke-width="7" stroke-linecap="round"/>

  <ellipse cx="500" cy="326" rx="34" ry="27" fill="none" stroke="#8bcf9a" stroke-width="10"/>
  <path d="M481 354 L470 392 M519 354 L530 392" stroke="#8bcf9a" stroke-width="7" stroke-linecap="round"/>
  <text x="552" y="333" fill="#d8e4da" font-family="system-ui, sans-serif" font-size="18">carabiner</text>

  <path d="M466 301 L531 344" stroke="#f1d88e" stroke-width="13" stroke-linecap="round"/>
  <text x="552" y="377" fill="#f1d88e" font-family="system-ui, sans-serif" font-size="18" font-weight="700">stick toggle catches here</text>
  <path d="M541 368 L521 347" stroke="#f1d88e" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M460 395 C434 417 424 453 430 526 C475 560 526 560 570 526 C576 453 565 418 540 395 Z" fill="#6fb18b" stroke="#a8d6b5" stroke-width="4" filter="url(#shadow)"/>
  <path d="M459 416 Q500 436 541 416" fill="none" stroke="#d9eadc" stroke-width="5"/>
  <text x="500" y="477" text-anchor="middle" fill="#0a110d" font-family="system-ui, sans-serif" font-size="20" font-weight="800">FOOD +</text>
  <text x="500" y="505" text-anchor="middle" fill="#0a110d" font-family="system-ui, sans-serif" font-size="20" font-weight="800">SMELLABLES</text>

  <path d="M388 553 L388 650" stroke="#f1d88e" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M407 553 L453 553 M407 650 L453 650" stroke="#f1d88e" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="365" y="608" text-anchor="end" fill="#f1d88e" font-family="system-ui, sans-serif" font-size="22" font-weight="800">≥ 12 ft</text>
  <text x="365" y="634" text-anchor="end" fill="#f1d88e" font-family="system-ui, sans-serif" font-size="15">bag bottom to ground</text>

  <path d="M585 470 L1000 470" stroke="#f1d88e" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="793" y="448" text-anchor="middle" fill="#f1d88e" font-family="system-ui, sans-serif" font-size="22" font-weight="800">≥ 6 ft horizontally</text>
  <text x="793" y="500" text-anchor="middle" fill="#f1d88e" font-family="system-ui, sans-serif" font-size="15">loaded bag to trunk / reachable support</text>

  <path d="M55 650 H1145" stroke="#52685a" stroke-width="5"/>
  <path d="M64 650 l22 -18 l18 18 l28 -14 l24 14 l25 -19 l22 19 l30 -13 l22 13 l25 -17 l23 17" fill="none" stroke="#6c8874" stroke-width="3"/>
  <text x="600" y="681" text-anchor="middle" fill="#b9cbbd" font-family="system-ui, sans-serif" font-size="16">Measure after the loaded branch flexes. Okanogan-Wenatchee legal minimum: 10 ft / 4 ft.</text>
  <text x="600" y="704" text-anchor="middle" fill="#b9cbbd" font-family="system-ui, sans-serif" font-size="16">This diagram uses PCTA's more conservative 12 ft / 6 ft target.</text>

  <g transform="translate(58 132)">
    <rect width="238" height="184" rx="18" fill="#0c130f" stroke="#496251"/>
    <text x="20" y="36" fill="#8bcf9a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">WHY THE TOGGLE?</text>
    <text x="20" y="70" fill="#d8e4da" font-family="system-ui, sans-serif" font-size="17">• no load-bearing cord</text>
    <text x="20" y="97" fill="#d8e4da" font-family="system-ui, sans-serif" font-size="17">  tied around the trunk</text>
    <text x="20" y="130" fill="#d8e4da" font-family="system-ui, sans-serif" font-size="17">• pull free end down to</text>
    <text x="20" y="157" fill="#d8e4da" font-family="system-ui, sans-serif" font-size="17">  retrieve and remove stick</text>
  </g>
</svg>
